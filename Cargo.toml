[workspace]
resolver = "2"
members = ["crates/fontcore", "crates/fontcore-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calebnanji/fontcore"

[workspace.dependencies]
fontcore = { path = "crates/fontcore", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ttf-parser = "0.24"
sha2 = "0.10"
directories = "5"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
